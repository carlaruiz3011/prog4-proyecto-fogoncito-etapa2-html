<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alta / edición de producto — Fogoncito</title>
</head>
<body>

    <header>
        <div class="logo">
            <span aria-hidden="true">🔥</span>
            <h1>FOGONCITO</h1>
        </div>
        <nav aria-label="Navegación principal">
            <ul>
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="menu.html">Menú</a></li>
                <li><a href="pedido.html">Mi pedido</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section aria-labelledby="titulo-form-producto">
            <h2 id="titulo-form-producto">Alta de producto</h2>
            <p>Completá los datos del producto. Los campos marcados con * son obligatorios.</p>

            <form action="#" method="post" enctype="multipart/form-data">

                <p>
                    <label for="nombre-producto">Nombre del producto *:</label>
                    <input type="text" id="nombre-producto" name="nombre-producto"
                           required>
                </p>

                <p>
                    <label for="descripcion-producto">Descripción *:</label>
                    <textarea id="descripcion-producto" name="descripcion-producto"
                              rows="3" required></textarea>
                </p>

                <p>
                    <label for="categoria-producto">Categoría *:</label>
                    <select id="categoria-producto" name="categoria-producto" required>
                        <option value="">Seleccioná una opción</option>
                        <option value="promociones">Promociones</option>
                        <option value="menu">Menú completo</option>
                        <option value="bebidas">Bebidas</option>
                    </select>
                </p>

                <p>
                    <label for="precio-producto">Precio *:</label>
                    <input type="number" id="precio-producto" name="precio-producto"
                           min="0" step="0.01" required>
                </p>

                <p>
                    <label for="stock-producto">Stock disponible:</label>
                    <input type="number" id="stock-producto" name="stock-producto"
                           min="0" step="1">
                </p>

                <p>
                    <label for="imagen-producto">Imagen del producto:</label>
                    <input type="file" id="imagen-producto" name="imagen-producto"
                           accept="image/*">
                </p>

                <p>
                    <label for="fecha-alta">Fecha de alta *:</label>
                    <input type="date" id="fecha-alta" name="fecha-alta" required>
                </p>

                <p>
                    <button type="submit">Guardar producto</button>
                </p>
            </form>
        </section>
    </main>

    <footer>
        <p>© 2025 Fogoncito — Hamburguesería artesanal</p>
    </footer>

</body>
</html>
